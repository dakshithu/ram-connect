[package]
name = "ram_connect_poc"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3"
bytes = "1.5"
mdns-sd = "0.11"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
serde_json = "1.0"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = "0.30"
rand = "0.8"
quinn = "0.10"
rcgen = "0.11"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
socket2 = "0.5"
tokio-util = { version = "0.7", features = ["codec", "net"] }
dashmap = "5.5"

[[bin]]
name = "contributor"
path = "src/bin/contributor.rs"

[[bin]]
name = "organizer"
path = "src/bin/organizer.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true